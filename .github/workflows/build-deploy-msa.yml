name: Build and Deploy
run-name: "Blog ${{ inputs.environment || 'prod' }} — ${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-deploy-msa.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [prod, dev]
        default: prod
      deploy:
        description: Update GitOps image tags after both builds pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: blog-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: blog
          - service: web
            image: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: image
        env:
          TARGET_ENV: ${{ inputs.environment || 'prod' }}
        run: |
          tag="${GITHUB_SHA:0:7}"
          if [ "$TARGET_ENV" = dev ]; then tag="dev-$tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/jaehyeong-tech-${{ matrix.image }}:${{ steps.image.outputs.tag }}
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=blog-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=blog-${{ matrix.service }}
  update-gitops:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JaeHeong/my-k8s-gitops
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
      - name: Update API and web together
        env:
          TARGET_ENV: ${{ inputs.environment }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -m pip install PyYAML
          python3 - <<'PY'
          import os, pathlib, re, yaml
          path = pathlib.Path(f'apps/jaehyeong-tech/values-{os.environ["TARGET_ENV"]}.yaml')
          text = path.read_text()
          values = yaml.safe_load(text)
          if 'api' not in values['services']:
              raise SystemExit('Unified API manifests must be installed before deployment')
          tag = os.environ['SOURCE_SHA'][:7]
          if os.environ['TARGET_ENV'] == 'dev': tag = 'dev-' + tag
          for service in ('api', 'web'):
              pattern = rf'(^  {service}:\n(?:(?!^  [a-zA-Z]).)*?^      tag:) [^\n]*'
              text, count = re.subn(pattern, rf'\g<1> "{tag}"', text, flags=re.M | re.S)
              if count != 1: raise SystemExit(f'Expected one tag for {service}, found {count}')
          path.write_text(text)
          PY
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add "apps/jaehyeong-tech/values-$TARGET_ENV.yaml"
          if ! git diff --cached --quiet; then
            git commit -m "Deploy blog $TARGET_ENV ${SOURCE_SHA:0:7}"
            git push origin HEAD:main
          fi
